<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>授权确认</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .consent-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 440px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.25);
        }
        .app-badge {
            text-align: center;
            margin-bottom: 24px;
        }
        .app-badge .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            font-size: 32px;
            margin-bottom: 12px;
        }
        .app-badge .app-name {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        .app-badge .app-desc {
            font-size: 14px;
            color: #999;
            margin-top: 4px;
        }
        .divider {
            height: 1px;
            background: #f0f0f0;
            margin: 20px 0;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
        }
        .scope-list {
            list-style: none;
        }
        .scope-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #f8f9ff;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #444;
        }
        .scope-list li .scope-icon { font-size: 18px; }
        .scope-list li .scope-name { font-weight: 500; }
        .scope-list li .scope-label { color: #888; font-size: 12px; }
        .user-info {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }
        .user-info span { color: #667eea; font-weight: 600; }
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-approve {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-approve:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }
        .btn-cancel:hover { background: #ebebeb; }
        .notice {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin-top: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="consent-card">
        <div class="app-badge">
            <div class="icon">🔐</div>
            <div class="app-name" th:text="${clientName}">应用名称</div>
            <div class="app-desc">请求访问你的账户</div>
        </div>

        <div class="user-info">
            当前登录账号：<span th:text="${principalName}">用户</span>
        </div>

        <div class="divider"></div>

        <div class="section-title">该应用请求以下权限</div>
        <ul class="scope-list">
            <li th:each="scope : ${scopes}">
                <span class="scope-icon">🔹</span>
                <div>
                    <div class="scope-name" th:text="${scope.label}">权限</div>
                    <div class="scope-label" th:text="${scope.name}">scope</div>
                </div>
            </li>
        </ul>

        <form method="post" action="/oauth2/authorize">
            <input type="hidden" name="client_id" th:value="${clientId}"/>
            <input type="hidden" name="state" th:value="${state}"/>
            <div th:each="scope : ${scopes}">
                <input type="hidden" name="scope" th:value="${scope.name}"/>
            </div>
            <div class="actions">
                <button type="submit" name="cancel" value="true" class="btn btn-cancel">拒绝</button>
                <button type="submit" class="btn btn-approve">同意授权</button>
            </div>
        </form>

        <div class="notice">
            授权后，该应用可以代表你访问上述权限范围内的数据。<br/>
            你可以随时撤销授权。
        </div>
    </div>
</body>
</html>
